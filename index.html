<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수시 컨설팅 문의 안내</title>
<style>
  :root {
    --card: #ffffff;
    --text: #14261c;
    --muted: #4b6153;
    --accent: #166534;
    --accent-dark: #14532d;
    --accent-soft: #ecfdf3;
    --accent-border: #d1fae0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
      "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: linear-gradient(160deg, #14532d 0%, #052e16 100%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    line-height: 1.6;
  }
  .card {
    background: var(--card);
    width: 100%;
    max-width: 520px;
    border-radius: 20px;
    padding: 48px 40px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    text-align: center;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 32px;
    word-break: keep-all;
    color: var(--accent-dark);
  }
  .notice {
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 28px;
    color: var(--text);
    font-size: 16px;
    word-break: keep-all;
  }
  .notice strong { color: var(--accent); }
  .kakao-id {
    display: inline-block;
    margin-top: 10px;
    font-size: 17px;
    font-weight: 700;
    color: var(--accent-dark);
    background: #fff;
    border: 1px solid var(--accent-border);
    padding: 8px 16px;
    border-radius: 10px;
    letter-spacing: 0.02em;
  }
  .contact {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .contact a {
    display: block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 15px 18px;
    border-radius: 12px;
    transition: background 0.15s ease;
  }
  .contact a:hover { background: var(--accent-dark); }
  .label {
    font-size: 13px;
    color: var(--muted);
    margin: 22px 0 12px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">수시 컨설팅 안내</span>
    <h1>수시 컨설팅 일정 문의는<br />학원 카카오톡으로<br />직접 문의해 주세요</h1>

    <div class="notice">
      <strong>카카오톡 ID</strong>
      <br />
      <span class="kakao-id">kisae-consulting</span>
    </div>

    <p class="label">전화 문의</p>
    <div class="contact">
      <a href="tel:01073062657">010-7306-2657</a>
      <a href="tel:01084518944">010-8451-8944</a>
    </div>
  </main>
</body>
</html>
